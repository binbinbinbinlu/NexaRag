name: Android app
on:
  push:
    paths: ['construction-photos-android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['construction-photos-android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: construction-photos-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build, test, and lint
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sitelens-debug
          path: construction-photos-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: construction-photos-android/app/build/reports/
