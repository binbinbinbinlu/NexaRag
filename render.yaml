services:
  - type: web
    name: nexarag
    runtime: docker
    plan: free
    branch: master
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: OPENAI_API_KEY
        sync: false
      - key: MEMBERS_JSON
        sync: false
